[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "example-streamlit-frontend"
version = "0.1.0"
description = "Example Streamlit frontend packaged with uv for Docker, calling the FastAPI backend."

requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name = "Example", email = "example@example.com" },
]
dependencies = [
  "streamlit>=1.38,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[project.scripts]
# Installs a console script named `serve-frontend` into the venv
serve-frontend = "streamlit_frontend.app:run"

[tool.uv]
index-url = "https://pypi.org/simple"

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_frontend"]
